<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111d">
<title>Moments — Your Gallery</title>
<style>
:root{--bg:#10111d;--ink:#f7f6ff;--muted:#b8bad0;--accent:#d4c0ff;--pink:#ffc3dc;--line:#ffffff22}*{box-sizing:border-box}header.top,.toolbar,.music-panel,.note,.tile-caption,.lightbox,.toast{display:none!important}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#302446,transparent 42%),radial-gradient(ellipse at 95% 15%,#1e3543,transparent 34%),var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}.wrap{width:min(1600px,calc(100% - 48px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none;font-weight:850;letter-spacing:.06em}.mark{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--pink));color:#21182e;font-size:21px}.btn{border:1px solid var(--line);border-radius:999px;padding:10px 15px;color:var(--ink);background:#ffffff0c;font:inherit;font-weight:750;cursor:pointer}.btn:hover{background:#ffffff18}.btn.primary{border:0;background:linear-gradient(120deg,var(--accent),var(--pink));color:#21182e}.hero{padding:34px 0 22px}.eyebrow{font-size:.76rem;letter-spacing:.17em;text-transform:uppercase;color:var(--pink);font-weight:800}.hero h1{font-size:clamp(2.5rem,6vw,4.6rem);letter-spacing:-.06em;line-height:1.02;margin:10px 0}.hero p{color:var(--muted);max-width:680px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 14px}.controls{display:flex;gap:8px;flex-wrap:wrap}.count{color:var(--muted);font-size:.9rem}.music-panel{margin:16px 0 24px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:#171827d9;backdrop-filter:blur(12px)}.music-panel h2{margin:0 0 4px;font-size:1.15rem}.music-panel p{margin:0 0 12px;color:var(--muted);font-size:.86rem}.music-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.music-controls select{max-width:100%;min-width:180px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#10111d;color:var(--ink);font:inherit}.music-controls audio{width:min(100%,440px)}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:8px 0 36px}.count{display:none}.tile-caption{display:none}.tile{border:0;border-radius:14px;box-shadow:0 12px 32px #0003;overflow:hidden;background:transparent;transition:transform .25s,box-shadow .25s}.tile:hover{transform:translateY(-3px);box-shadow:0 18px 42px #0005}.tile-media{height:auto;aspect-ratio:4/5;border-radius:14px;cursor:default}.tile:nth-child(5n+2) .tile-media{aspect-ratio:3/4}.tile-media img,.tile-media video{object-fit:cover}.tile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#ffffff08;min-width:0;box-shadow:0 18px 45px #0002;transition:transform .25s,box-shadow .25s}.tile:hover{transform:translateY(-4px);box-shadow:0 24px 55px #0005}.tile-media{height:245px;display:grid;place-items:center;background:linear-gradient(135deg,#44335e,#d5a9c8);overflow:hidden;cursor:zoom-in}.tile-media img,.tile-media video{width:100%;height:100%;object-fit:cover;display:block}.tile-caption{padding:13px 15px 16px}.tile-caption strong{display:block;overflow-wrap:anywhere}.tile-caption span{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}.theme-scrapbook .tile:nth-child(odd){transform:rotate(-1deg)}.theme-scrapbook .tile:nth-child(even){transform:rotate(1deg)}.theme-scrapbook .tile{border:6px solid #f0dfc9;border-radius:4px;background:#f0dfc9;color:#2d2633}.theme-scrapbook .tile-caption span{color:#65576a}.theme-polaroid .tile{border:8px solid #f4eee3;border-bottom-width:18px;border-radius:3px;background:#f4eee3;color:#30283b}.theme-polaroid .tile-media{border-radius:1px}.theme-polaroid .tile-caption{text-align:center}.theme-polaroid .tile-caption span{color:#675b70}.theme-cinema .tile{border-radius:7px;border-color:#ffffff35;background:#090a10}.theme-cinema .tile-media{height:230px;border-bottom:4px solid #05060a}.theme-dreamy .tile{background:linear-gradient(145deg,#252037,#171a29)}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:22px;color:var(--muted)}.lightbox{position:fixed;inset:0;z-index:20;background:#080912ed;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:24px}.lightbox.open{display:flex}.lightbox-content{width:min(100%,1000px);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px}.lightbox img,.lightbox video{display:block;max-width:100%;max-height:73vh;object-fit:contain;border-radius:14px;box-shadow:0 25px 90px #0009}.lightbox-caption{text-align:center;font-family:Georgia,serif;font-size:1.2rem}.close{position:absolute;right:20px;top:18px;width:44px;height:44px;border:1px solid #ffffff55;border-radius:50%;background:#242437;color:white;font-size:1.5rem;cursor:pointer}.lightbox-controls{display:flex;gap:10px}.note{font-size:.82rem;color:var(--muted);padding:0 0 30px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#f5eaff;color:#21172e;padding:11px 16px;border-radius:999px;font-weight:750;z-index:30;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1000px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.wrap{width:calc(100% - 18px)}.hero{padding:18px 0 10px}.hero h1{font-size:clamp(2rem,8vw,3rem)}.tile-media{border-radius:9px}.tile{border-radius:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="wrap"><section class="hero"><div class="eyebrow">Your collection is ready</div><h1 id="galleryTitle">Your little moments.</h1><p id="gallerySubtitle">A collection of moments worth keeping.</p></section>
<div class="count" id="count" aria-live="polite">Loading your memories…</div>
<section class="gallery theme-dreamy" id="gallery" aria-label="Your photo gallery"></section>
</main>

<script>
(()=> {
const $=id=>document.getElementById(id);let project=null,items=[],current=0,slideTimer=null,objectUrls=[],musicUrls=[];
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2300)}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('momentsGalleryDB',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('projects'))req.result.createObjectStore('projects')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function loadProject(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('projects','readonly'),req=tx.objectStore('projects').get('current');req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}
function mediaUrl(item){if(item.url)return item.url;if(item.blob){const u=URL.createObjectURL(item.blob);objectUrls.push(u);return u}return ''}
function applyBackground(){if(!project)return;const color=project.backgroundColor||'#10111d';document.body.style.backgroundColor=color;if(project.backgroundBlob){const u=URL.createObjectURL(project.backgroundBlob);objectUrls.push(u);document.body.style.backgroundImage='linear-gradient(#10111d70,#10111d9c),url("'+u.replace(/"/g,'%22')+'")';document.body.style.backgroundSize='cover';document.body.style.backgroundPosition='center';document.body.style.backgroundAttachment='fixed'}else{document.body.style.backgroundImage='radial-gradient(ellipse at 10% 0%,#30244680,transparent 42%),radial-gradient(ellipse at 95% 15%,#1e354380,transparent 34%)';document.body.style.backgroundSize='auto';document.body.style.backgroundAttachment='scroll'}}
function setupMusic(){const tracks=project?.music||[];if(!tracks.length)return;$('musicPanel').hidden=false;const select=$('musicSelect'),player=$('musicPlayer');select.replaceChildren();tracks.forEach((track,i)=>{if(!track.blob)return;const url=URL.createObjectURL(track.blob);musicUrls.push(url);const option=document.createElement('option');option.value=url;option.textContent=track.name||('Song '+(i+1));select.append(option)});if(select.options.length){player.src=select.value;select.addEventListener('change',()=>{player.src=select.value;player.load()});player.addEventListener('ended',()=>{if(select.selectedIndex<select.options.length-1){select.selectedIndex++;player.src=select.value;player.play().catch(()=>{})}})}}
function closeLightbox(){$('lightbox').classList.remove('open')}
function openLightbox(index){if(!items.length)return;current=(index+items.length)%items.length;const item=items[current];$('lightboxContent').querySelector('img,video')?.remove();const el=document.createElement(item.type==='video'?'video':'img');el.src=item.displayUrl;el.alt=item.name;if(item.type==='video'){el.controls=true;el.autoplay=true;el.playsInline=true}else el.addEventListener('click',()=>{});$('lightboxContent').insertBefore(el,$('lightboxCaption'));$('lightboxCaption').textContent=item.caption||item.name;$('lightbox').classList.add('open')}
function render(){const grid=$('gallery');grid.replaceChildren();grid.className='gallery theme-'+(project?.theme||'dreamy');if(!items.length){grid.innerHTML='<div class="empty">Your photos will appear here.</div>';$('count').textContent='0 moments';return}items.forEach((item,i)=>{const tile=document.createElement('article');tile.className='tile';const visual=document.createElement('div');visual.className='tile-media';const media=document.createElement(item.type==='video'?'video':'img');media.src=item.displayUrl;media.alt=item.name;if(item.type==='video'){media.controls=true;media.preload='metadata';media.playsInline=true;visual.style.cursor='default'}else{media.loading='lazy';visual.style.cursor='default'}visual.append(media);const caption=document.createElement('div');caption.className='tile-caption';const title=document.createElement('strong');title.textContent=item.caption||item.name;const meta=document.createElement('span');meta.textContent=(i+1)+' / '+items.length+' · '+(item.type==='video'?'Video':'Photo');caption.append(title,meta);tile.append(visual,caption);grid.append(tile)});$('count').textContent=items.length+' moment'+(items.length===1?'':'s')+' · '+(project.theme||'dreamy')+' style'}
function stopSlides(){clearInterval(slideTimer);slideTimer=null;$('play').textContent='▶ Slideshow'}
$('close').addEventListener('click',closeLightbox);$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLightbox()});$('prev').addEventListener('click',()=>openLightbox(current-1));$('next').addEventListener('click',()=>openLightbox(current+1));
$('shuffle').addEventListener('click',()=>{if(items.length<2){toast('Add more photos to shuffle.');return}const grid=$('gallery');for(let i=grid.children.length;i>0;i--)grid.appendChild(grid.children[Math.floor(Math.random()*i)]);toast('Your memories have been shuffled ✦')});
$('play').addEventListener('click',()=>{if(slideTimer){stopSlides();return}if(items.length<2){toast('Add at least two moments for a slideshow.');return}let i=0;$('play').textContent='Ⅱ Pause';slideTimer=setInterval(()=>{const images=items.map((it,j)=>({it,j})).filter(x=>x.it.type==='image');if(images.length){const next=images[i%images.length];openLightbox(next.j);i++}else{stopSlides();toast('Add photos to use the slideshow.')}},3000);openLightbox(items.findIndex(x=>x.type==='image')<0?0:items.findIndex(x=>x.type==='image'))});
$('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await $('gallery').requestFullscreen();else await document.exitFullscreen()}catch{toast('Fullscreen is not available in this browser.')}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();if($('lightbox').classList.contains('open')&&e.key==='ArrowRight')openLightbox(current+1);if($('lightbox').classList.contains('open')&&e.key==='ArrowLeft')openLightbox(current-1)});
(async()=>{try{project=await loadProject();if(!project){items=[];render();$('galleryTitle').textContent='Your gallery is waiting';$('gallerySubtitle').textContent='Go back to the first page to choose your files and gallery style.';return}$('galleryTitle').textContent=project.title||'Your little moments';$('gallerySubtitle').textContent=project.subtitle||'A collection of moments worth keeping.';items=(project.items||[]).map(item=>({...item,displayUrl:mediaUrl(item)}));applyBackground();setupMusic();render()}catch(err){console.error(err);$('gallery').innerHTML='<div class="empty"><h2>Could not load this gallery</h2><p>Please return to the creator page and try again in the same browser.</p><a class="btn primary" href="index.html">Back to the creator</a></div>';$('count').textContent='Gallery unavailable'}})();
window.addEventListener('beforeunload',()=>{stopSlides();objectUrls.forEach(URL.revokeObjectURL);musicUrls.forEach(URL.revokeObjectURL)});
})();
</script>
</body></html>
